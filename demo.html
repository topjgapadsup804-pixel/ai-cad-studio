<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 坪三房兩廳｜2D CAD × 3D 互動戶型展示 Demo</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131926;
      --panel-2: #1a2233;
      --border: #263248;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --elec: #f59e0b;
      --plumb: #3b82f6;
      --success: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      height: 56px; padding: 0 20px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-shrink: 0;
    }
    .title-group { display: flex; align-items: center; gap: 12px; }
    .back-link {
      font-size: 0.85rem; color: var(--muted); text-decoration: none;
      padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    }
    .back-link:hover { color: var(--text); border-color: var(--accent); }
    .title { font-weight: 700; font-size: 0.98rem; }
    .title span { color: var(--accent); }
    .mode-switch {
      display: flex; background: var(--bg); padding: 4px; border-radius: 8px; border: 1px solid var(--border);
    }
    .mode-btn {
      background: transparent; color: var(--muted); border: none;
      padding: 6px 14px; border-radius: 6px; font-size: 0.86rem; font-weight: 600; cursor: pointer;
    }
    .mode-btn.active { background: var(--accent); color: #081018; }

    .workspace { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
    @media (max-width: 820px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { max-height: 40vh; overflow-y: auto; border-right: none; border-top: 1px solid var(--border); }
    }
    aside {
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
    }
    .panel-section h3 {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 10px;
    }
    .toggle-list { display: grid; gap: 8px; }
    .toggle {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.88rem;
    }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
    }
    .stat-card small { display: block; color: var(--muted); font-size: 0.76rem; }
    .stat-card strong { font-size: 1.05rem; color: var(--accent); }

    .room-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .room-table td { padding: 5px 0; border-bottom: 1px solid rgba(38,50,72,0.6); }
    .room-table td:last-child { text-align: right; color: var(--muted); }

    .canvas-wrap { position: relative; background: radial-gradient(circle at 50% 35%, #131c2e 0%, #090d14 75%); overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(19, 25, 38, 0.86); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; color: var(--muted);
      backdrop-filter: blur(6px); pointer-events: none;
    }
    .hud-right {
      position: absolute; bottom: 16px; right: 16px; display: flex; gap: 8px;
    }
    .hud-btn {
      background: rgba(19, 25, 38, 0.9); color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer;
    }
    .hud-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cta-mini {
      display: block; text-align: center; background: var(--accent); color: #081018;
      font-weight: 700; padding: 10px 14px; border-radius: 8px; text-decoration: none; font-size: 0.88rem;
    }
    .cta-mini:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <a href="index.html" class="back-link">← 返回報價頁</a>
      <div class="title"><span>DRAFTPRO</span> 30.2 坪標準三房兩廳兩衛｜互動展示 Demo</div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn3D">3D 互動鳥瞰</button>
      <button class="mode-btn" id="btn2D">2D CAD 平面圖</button>
    </div>
  </header>

  <div class="workspace">
    <aside>
      <div class="panel-section">
        <h3>圖層開關（即時切換）</h3>
        <div class="toggle-list">
          <label class="toggle"><span><span class="dot" style="background:#94a3b8;"></span>家具與廚衛配置</span><input type="checkbox" id="layerFurn" checked /></label>
          <label class="toggle"><span><span class="dot" style="background:#38bdf8;"></span>CAD 尺寸與房名標註</span><input type="checkbox" id="layerDim" checked /></label>
          <label class="toggle"><span><span class="dot" style="background:#f59e0b;"></span>強電 / 迴路管線</span><input type="checkbox" id="layerElec" checked /></label>
          <label class="toggle"><span><span class="dot" style="background:#3b82f6;"></span>給排水管路系統</span><input type="checkbox" id="layerPlumb" /></label>
        </div>
      </div>

      <div class="panel-section">
        <h3>空間指標</h3>
        <div class="stats-grid">
          <div class="stat-card"><small>室內實坪</small><strong>30.2 坪</strong></div>
          <div class="stat-card"><small>格局配置</small><strong>3房 2廳 2衛</strong></div>
          <div class="stat-card"><small>參考面寬 × 進深</small><strong>11.4m × 8.8m</strong></div>
          <div class="stat-card"><small>初估基礎工程</small><strong>NT$ 145 萬</strong></div>
        </div>
      </div>

      <div class="panel-section">
        <h3>各空間面積清單</h3>
        <table class="room-table" id="roomList"></table>
      </div>

      <a href="index.html#estimator" class="cta-mini">把我的格局圖也做成這樣 →</a>
    </aside>

    <div class="canvas-wrap">
      <canvas id="viewport"></canvas>
      <div class="hud" id="hudHint">拖曳旋轉視角｜滾輪縮放｜右上切換 2D CAD / 3D 鳥瞰</div>
      <div class="hud-right">
        <button class="hud-btn" id="btnReset">重設視角</button>
        <button class="hud-btn" id="btnRotate">自動旋轉</button>
      </div>
    </div>
  </div>

  <script>
    // 11.4m x 8.8m = ~100.32 m2 (~30.3 坪)
    const PLAN_W = 11.4, PLAN_D = 8.8, WALL_H = 2.7;

    const ROOMS = [
      { name: '客廳', x: 0, y: 0, w: 4.8, d: 4.6, color: '#1e293b', floor3d: '#2c3a4f' },
      { name: '餐廳', x: 4.8, y: 0, w: 3.2, d: 3.4, color: '#1e293b', floor3d: '#283548' },
      { name: '玄關', x: 4.8, y: 3.4, w: 3.2, d: 1.2, color: '#243044', floor3d: '#334155' },
      { name: '廚房', x: 8.0, y: 0, w: 3.4, d: 3.4, color: '#1b2b34', floor3d: '#243b47' },
      { name: '工作陽台', x: 8.0, y: 3.4, w: 3.4, d: 1.2, color: '#1a2723', floor3d: '#213630' },
      { name: '主臥室', x: 0, y: 4.6, w: 4.6, d: 4.2, color: '#22283d', floor3d: '#2f3854' },
      { name: '主衛', x: 4.6, y: 4.6, w: 2.0, d: 2.2, color: '#182b3a', floor3d: '#1f3b4f' },
      { name: '客衛', x: 4.6, y: 6.8, w: 2.0, d: 2.0, color: '#182b3a', floor3d: '#1f3b4f' },
      { name: '次臥', x: 6.6, y: 4.6, w: 2.6, d: 4.2, color: '#23293c', floor3d: '#313a52' },
      { name: '書房 / 客房', x: 9.2, y: 4.6, w: 2.2, d: 4.2, color: '#252a3a', floor3d: '#333b4f' }
    ];

    // Furniture boxes: [x, y, w, d, h, color, label]
    const FURNITURE = [
      // 客廳沙發、茶几、電視櫃
      [0.4, 0.5, 2.8, 0.95, 0.85, '#475569', '沙發'],
      [1.0, 1.9, 1.4, 0.75, 0.42, '#64748b', '茶几'],
      [0.6, 3.9, 2.6, 0.45, 0.55, '#334155', '電視櫃'],
      // 餐廳餐桌
      [5.5, 1.1, 1.7, 0.95, 0.75, '#7c5c43', '餐桌'],
      // 廚房流理台
      [8.2, 0.2, 3.0, 0.65, 0.88, '#475569', '廚具'],
      [10.4, 1.5, 0.75, 0.75, 1.75, '#64748b', '冰箱'],
      // 主臥雙人床、衣櫃
      [0.5, 5.4, 1.9, 2.1, 0.55, '#6366f1', '主臥床'],
      [3.7, 5.0, 0.65, 3.2, 2.2, '#475569', '衣櫃'],
      // 次臥單人床、書桌
      [6.9, 6.4, 1.2, 2.0, 0.52, '#38bdf8', '單人床'],
      [8.4, 5.1, 0.6, 1.3, 0.75, '#64748b', '書桌'],
      // 書房書桌
      [9.5, 5.2, 1.6, 0.65, 0.75, '#7c5c43', '工作桌'],
      // 衛浴
      [4.8, 4.9, 0.7, 0.55, 0.45, '#cbd5e1', '馬桶'],
      [5.8, 4.8, 0.65, 1.5, 0.82, '#94a3b8', '洗手台'],
      [4.8, 7.1, 0.7, 0.55, 0.45, '#cbd5e1', '馬桶']
    ];

    // Electrical conduits (from panel at entrance 5.0, 3.5)
    const ELEC_LINES = [
      [[5.0, 3.6], [5.0, 2.0], [2.0, 2.0], [2.0, 4.1]],
      [[5.0, 3.6], [6.4, 1.6], [9.5, 0.6]],
      [[5.0, 3.6], [2.2, 4.6], [2.2, 6.4]],
      [[5.0, 3.6], [7.8, 4.6], [7.8, 6.6]],
      [[5.0, 3.6], [10.2, 4.6], [10.2, 5.6]]
    ];

    // Plumbing lines (wet zones: kitchen + two baths + balcony)
    const PLUMB_LINES = [
      [[9.6, 3.9], [9.6, 0.5], [8.5, 0.5]],
      [[9.6, 3.9], [5.6, 3.9], [5.6, 5.5], [5.6, 7.8]],
      [[5.6, 5.5], [4.9, 5.2]],
      [[5.6, 7.8], [4.9, 7.4]]
    ];

    // Populate room table
    const roomListEl = document.getElementById('roomList');
    ROOMS.forEach(r => {
      const ping = ((r.w * r.d) / 3.305785).toFixed(1);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.name}</td><td>${r.w.toFixed(1)}×${r.d.toFixed(1)}m (${ping}坪)</td>`;
      roomListEl.appendChild(tr);
    });

    const canvas = document.getElementById('viewport');
    const ctx = canvas.getContext('2d');

    let mode = '3D';
    let yaw = -0.62, pitch = 0.68, zoom = 1.0;
    let dragging = false, lastX = 0, lastY = 0;
    let autoRotate = false;

    const layers = {
      furn: document.getElementById('layerFurn'),
      dim: document.getElementById('layerDim'),
      elec: document.getElementById('layerElec'),
      plumb: document.getElementById('layerPlumb')
    };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }
    window.addEventListener('resize', resize);

    function project3D(x, y, z) {
      const cx = x - PLAN_W / 2;
      const cy = y - PLAN_D / 2;
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const rx = cx * cosY - cy * sinY;
      const ry = cx * sinY + cy * cosY;

      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      const py = ry * cosP - z * sinP;
      const scale = Math.min(canvas.clientWidth, canvas.clientHeight) * 0.062 * zoom;
      return {
        x: canvas.clientWidth / 2 + rx * scale,
        y: canvas.clientHeight / 2 + py * scale
      };
    }

    function poly3D(pts, fill, stroke, lw = 1) {
      ctx.beginPath();
      pts.forEach((p, i) => {
        const s = project3D(p[0], p[1], p[2]);
        if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
      });
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
    }

    function drawBox3D(x, y, w, d, h, topCol, sideCol) {
      // Top
      poly3D([[x,y,h],[x+w,y,h],[x+w,y+d,h],[x,y+d,h]], topCol, 'rgba(255,255,255,0.12)', 0.8);
      // Visible sides (painter's simple approximation)
      poly3D([[x,y+d,0],[x+w,y+d,0],[x+w,y+d,h],[x,y+d,h]], sideCol, 'rgba(0,0,0,0.25)', 0.7);
      poly3D([[x+w,y,0],[x+w,y+d,0],[x+w,y+d,h],[x+w,y,h]], sideCol, 'rgba(0,0,0,0.25)', 0.7);
      poly3D([[x,y,0],[x+w,y,0],[x+w,y,h],[x,y,h]], sideCol, 'rgba(0,0,0,0.2)', 0.6);
      poly3D([[x,y,0],[x,y+d,0],[x,y+d,h],[x,y,h]], sideCol, 'rgba(0,0,0,0.2)', 0.6);
    }

    function draw3D() {
      // Base slab
      poly3D([[-0.2,-0.2,-0.25],[PLAN_W+0.2,-0.2,-0.25],[PLAN_W+0.2,PLAN_D+0.2,-0.25],[-0.2,PLAN_D+0.2,-0.25]], '#0f172a', '#334155', 1.5);

      // Room floors
      ROOMS.forEach(r => {
        poly3D([[r.x,r.y,0],[r.x+r.w,r.y,0],[r.x+r.w,r.y+r.d,0],[r.x,r.y+r.d,0]], r.floor3d, '#3b4c66', 1);
      });

      // Outer & inner semi-transparent architectural walls
      const wallSegs = [
        [0,0,PLAN_W,0], [PLAN_W,0,PLAN_W,PLAN_D], [PLAN_W,PLAN_D,0,PLAN_D], [0,PLAN_D,0,0],
        [0,4.6,PLAN_W,4.6], [4.8,0,4.8,4.6], [8.0,0,8.0,4.6], [4.6,4.6,4.6,8.8],
        [6.6,4.6,6.6,8.8], [9.2,4.6,9.2,8.8], [4.6,6.8,6.6,6.8], [4.8,3.4,11.4,3.4]
      ];
      wallSegs.forEach(([x1,y1,x2,y2]) => {
        poly3D([[x1,y1,0],[x2,y2,0],[x2,y2,WALL_H*0.52],[x1,y1,WALL_H*0.52]], 'rgba(148,163,184,0.22)', 'rgba(203,213,225,0.55)', 1.2);
      });

      // Furniture
      if (layers.furn.checked) {
        FURNITURE.forEach(([x,y,w,d,h,col]) => drawBox3D(x, y, w, d, h, col, 'rgba(15,23,42,0.75)'));
      }

      // Electrical
      if (layers.elec.checked) {
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.2;
        ELEC_LINES.forEach(path => {
          ctx.beginPath();
          path.forEach(([x,y], i) => {
            const p = project3D(x, y, 0.15);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });
      }

      // Plumbing
      if (layers.plumb.checked) {
        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2.6;
        PLUMB_LINES.forEach(path => {
          ctx.beginPath();
          path.forEach(([x,y], i) => {
            const p = project3D(x, y, 0.08);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });
      }

      // Labels
      if (layers.dim.checked) {
        ctx.font = '600 12px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center';
        ROOMS.forEach(r => {
          const p = project3D(r.x + r.w / 2, r.y + r.d / 2, 0.2);
          ctx.fillStyle = 'rgba(15,23,42,0.75)';
          ctx.fillRect(p.x - 28, p.y - 11, 56, 18);
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText(r.name, p.x, p.y + 2);
        });
      }
    }

    function draw2D() {
      const pad = 64;
      const scale = Math.min((canvas.clientWidth - pad * 2) / PLAN_W, (canvas.clientHeight - pad * 2) / PLAN_D) * zoom;
      const ox = (canvas.clientWidth - PLAN_W * scale) / 2;
      const oy = (canvas.clientHeight - PLAN_D * scale) / 2;
      const sx = x => ox + x * scale;
      const sy = y => oy + y * scale;

      // CAD grid
      ctx.strokeStyle = 'rgba(56,189,248,0.06)'; ctx.lineWidth = 1;
      for (let gx = 0; gx <= PLAN_W + 0.1; gx += 1) {
        ctx.beginPath(); ctx.moveTo(sx(gx), sy(0)); ctx.lineTo(sx(gx), sy(PLAN_D)); ctx.stroke();
      }
      for (let gy = 0; gy <= PLAN_D + 0.1; gy += 1) {
        ctx.beginPath(); ctx.moveTo(sx(0), sy(gy)); ctx.lineTo(sx(PLAN_W), sy(gy)); ctx.stroke();
      }

      // Rooms
      ROOMS.forEach(r => {
        ctx.fillStyle = r.color;
        ctx.fillRect(sx(r.x), sy(r.y), r.w * scale, r.d * scale);
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2.4;
        ctx.strokeRect(sx(r.x), sy(r.y), r.w * scale, r.d * scale);
      });

      // Outer structural wall
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
      ctx.strokeRect(sx(0), sy(0), PLAN_W * scale, PLAN_D * scale);

      // Furniture
      if (layers.furn.checked) {
        FURNITURE.forEach(([x,y,w,d,,col,label]) => {
          ctx.fillStyle = col; ctx.globalAlpha = 0.55;
          ctx.fillRect(sx(x), sy(y), w * scale, d * scale);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
          ctx.strokeRect(sx(x), sy(y), w * scale, d * scale);
          ctx.fillStyle = '#e2e8f0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(label, sx(x + w / 2), sy(y + d / 2) + 3);
        });
      }

      // Electrical
      if (layers.elec.checked) {
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
        ELEC_LINES.forEach(path => {
          ctx.beginPath();
          path.forEach(([x,y], i) => i === 0 ? ctx.moveTo(sx(x), sy(y)) : ctx.lineTo(sx(x), sy(y)));
          ctx.stroke();
        });
        ctx.setLineDash([]);
      }

      // Plumbing
      if (layers.plumb.checked) {
        ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2.5;
        PLUMB_LINES.forEach(path => {
          ctx.beginPath();
          path.forEach(([x,y], i) => i === 0 ? ctx.moveTo(sx(x), sy(y)) : ctx.lineTo(sx(x), sy(y)));
          ctx.stroke();
        });
      }

      // Dimensions & room labels
      if (layers.dim.checked) {
        ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1;
        // Top total dimension
        const yDim = sy(0) - 22;
        ctx.beginPath(); ctx.moveTo(sx(0), yDim); ctx.lineTo(sx(PLAN_W), yDim); ctx.stroke();
        ctx.font = '600 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText('11,400 mm', sx(PLAN_W / 2), yDim - 6);

        // Left total dimension
        const xDim = sx(0) - 22;
        ctx.beginPath(); ctx.moveTo(xDim, sy(0)); ctx.lineTo(xDim, sy(PLAN_D)); ctx.stroke();
        ctx.save(); ctx.translate(xDim - 8, sy(PLAN_D / 2)); ctx.rotate(-Math.PI / 2);
        ctx.fillText('8,800 mm', 0, 0); ctx.restore();

        ROOMS.forEach(r => {
          ctx.fillStyle = '#f8fafc'; ctx.font = '600 12px "Noto Sans TC", sans-serif';
          ctx.fillText(r.name, sx(r.x + r.w / 2), sy(r.y + r.d / 2) - 4);
          ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace';
          ctx.fillText(`${(r.w*1000).toFixed(0)}×${(r.d*1000).toFixed(0)}`, sx(r.x + r.w / 2), sy(r.y + r.d / 2) + 12);
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      if (mode === '3D') draw3D(); else draw2D();
    }

    // Interactions
    canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; autoRotate = false; });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('mousemove', e => {
      if (!dragging || mode !== '3D') return;
      yaw += (e.clientX - lastX) * 0.008;
      pitch = Math.max(0.25, Math.min(1.25, pitch + (e.clientY - lastY) * 0.006));
      lastX = e.clientX; lastY = e.clientY;
      draw();
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      zoom = Math.max(0.6, Math.min(2.0, zoom - e.deltaY * 0.001));
      draw();
    }, { passive: false });

    document.getElementById('btn3D').onclick = () => {
      mode = '3D';
      document.getElementById('btn3D').classList.add('active');
      document.getElementById('btn2D').classList.remove('active');
      draw();
    };
    document.getElementById('btn2D').onclick = () => {
      mode = '2D'; autoRotate = false;
      document.getElementById('btn2D').classList.add('active');
      document.getElementById('btn3D').classList.remove('active');
      draw();
    };
    document.getElementById('btnReset').onclick = () => { yaw = -0.62; pitch = 0.68; zoom = 1.0; autoRotate = false; draw(); };
    document.getElementById('btnRotate').onclick = () => { autoRotate = !autoRotate; };
    Object.values(layers).forEach(el => el.addEventListener('change', draw));

    function loop() {
      if (autoRotate && mode === '3D') { yaw += 0.005; draw(); }
      requestAnimationFrame(loop);
    }
    resize();
    loop();
  </script>
</body>
</html>
