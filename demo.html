<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30.2 坪現代極簡三房兩廳｜高階 3D 空間漫遊 × 2D 建築施工圖</title>
  <!-- Three.js & OrbitControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(18, 25, 41, 0.88);
      --panel-border: rgba(56, 189, 248, 0.2);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    header {
      height: 60px; padding: 0 24px; background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; justify-content: space-between; z-index: 10;
    }
    .brand-title { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.05rem; }
    .brand-title span { color: var(--accent); }
    .back-btn {
      font-size: 0.85rem; color: var(--muted); text-decoration: none;
      padding: 6px 12px; border: 1px solid var(--panel-border); border-radius: 6px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); }

    .view-modes {
      display: flex; gap: 6px; background: #070a12; padding: 4px; border-radius: 8px; border: 1px solid #1e293b;
    }
    .mode-btn {
      background: transparent; color: var(--muted); border: none; padding: 7px 16px;
      border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active { background: var(--accent); color: #081018; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

    .main-stage { flex: 1; position: relative; overflow: hidden; }
    #webgl-canvas { width: 100%; height: 100%; display: block; }
    #cad2d-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #0a0e17;
    }

    /* Floating UI Controls */
    .floating-panel {
      position: absolute; top: 20px; left: 20px; z-index: 5;
      background: var(--panel); backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 14px;
      padding: 20px; width: 280px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .panel-group { margin-bottom: 16px; }
    .panel-group:last-child { margin-bottom: 0; }
    .panel-title { font-size: 0.76rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 10px; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; background: rgba(30, 41, 59, 0.5); border-radius: 8px; margin-bottom: 6px;
      font-size: 0.88rem; cursor: pointer; border: 1px solid transparent;
    }
    .toggle-row:hover { border-color: rgba(56, 189, 248, 0.3); }
    .toggle-row input { accent-color: var(--accent); width: 16px; height: 16px; }

    .lighting-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .light-btn {
      padding: 8px; border: 1px solid var(--panel-border); background: rgba(30,41,59,0.6);
      color: var(--text); border-radius: 6px; cursor: pointer; font-size: 0.84rem; text-align: center;
    }
    .light-btn.active { background: rgba(56, 189, 248, 0.18); border-color: var(--accent); color: var(--accent); }

    /* Bottom HUD */
    .hud-controls {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: var(--panel); backdrop-filter: blur(16px);
      padding: 8px 16px; border-radius: 999px; border: 1px solid var(--panel-border); z-index: 5;
    }
    .hud-pill {
      background: transparent; color: var(--text); border: none; font-size: 0.84rem;
      padding: 6px 12px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .hud-pill:hover { background: rgba(255,255,255,0.08); }
    .hud-pill.active { background: var(--accent); color: #081018; font-weight: 600; }

    /* Room Label Overlay */
    .room-badge {
      position: absolute; bottom: 24px; right: 24px;
      background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--panel-border);
      padding: 14px 20px; border-radius: 12px; z-index: 5; font-size: 0.86rem;
    }
    .room-badge strong { color: var(--accent); font-size: 1.1rem; display: block; margin-bottom: 2px; }

    @media (max-width: 768px) {
      .floating-panel { display: none; }
      .room-badge { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <a href="index.html" class="back-btn">← 返回服務首頁</a>
      <div>DRAFT<span>PRO</span> STUDIO ｜ 30.2 坪三房兩廳互動展示</div>
    </div>
    <div class="view-modes">
      <button class="mode-btn active" id="modeOrbit">3D 鳥瞰漫遊</button>
      <button class="mode-btn" id="modeFPS">第一人稱視角</button>
      <button class="mode-btn" id="modeCAD">2D 建築施工圖</button>
    </div>
  </header>

  <div class="main-stage">
    <!-- WebGL Canvas for Realistic 3D -->
    <canvas id="webgl-canvas"></canvas>
    <!-- 2D Canvas for Clean CAD Plan -->
    <canvas id="cad2d-canvas"></canvas>

    <!-- Interactive Toggles Panel -->
    <div class="floating-panel" id="floatingPanel">
      <div class="panel-group">
        <div class="panel-title">即時圖層切換</div>
        <label class="toggle-row">
          <span>🛋️ 實木家具與廚衛設備</span>
          <input type="checkbox" id="chkFurniture" checked />
        </label>
        <label class="toggle-row">
          <span>⚡ 弱電迴路與插座管線</span>
          <input type="checkbox" id="chkElectrical" checked />
        </label>
        <label class="toggle-row">
          <span>💧 給水 / 排水管路系統</span>
          <input type="checkbox" id="chkPlumbing" checked />
        </label>
        <label class="toggle-row">
          <span>📐 CAD 尺寸標註與房名</span>
          <input type="checkbox" id="chkLabels" checked />
        </label>
      </div>

      <div class="panel-group">
        <div class="panel-title">光影氛圍情境</div>
        <div class="lighting-opts">
          <button class="light-btn active" id="btnDay">☀️ 自然採光</button>
          <button class="light-btn" id="btnNight">🌙 晚間溫馨光</button>
        </div>
      </div>
    </div>

    <!-- HUD Action Bar -->
    <div class="hud-controls">
      <button class="hud-pill" id="btnResetCam">🎯 重設視角</button>
      <button class="hud-pill" id="btnAutoSpin">🔄 360° 自動旋轉</button>
      <button class="hud-pill" id="btnRoomLiving">客廳</button>
      <button class="hud-pill" id="btnRoomMaster">主臥</button>
      <button class="hud-pill" id="btnRoomDining">餐廚</button>
    </div>

    <!-- Info Overlay -->
    <div class="room-badge">
      <strong>30.2 坪 (100.3 m²)</strong>
      <span>3 房 2 廳 2 衛 ｜ 挑高 2.8m 現代簡約</span>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // CONSTANTS & ROOM DATA (Units in Meters: 11.4m x 8.8m)
    // ----------------------------------------------------
    const PLAN_W = 11.4, PLAN_D = 8.8, WALL_H = 2.4, WALL_THICK = 0.16;

    const ROOMS = [
      { name: "客廳", x: 0, z: 0, w: 4.8, d: 4.6, floorColor: 0xe2dcd5 },
      { name: "餐廳", x: 4.8, z: 0, w: 3.2, d: 3.4, floorColor: 0xdfd8d0 },
      { name: "玄關", x: 4.8, z: 3.4, w: 3.2, d: 1.2, floorColor: 0x94a3b8 },
      { name: "廚房", x: 8.0, z: 0, w: 3.4, d: 3.4, floorColor: 0xcfd8dc },
      { name: "陽台", x: 8.0, z: 3.4, w: 3.4, d: 1.2, floorColor: 0xb0bec5 },
      { name: "主臥室", x: 0, z: 4.6, w: 4.6, d: 4.2, floorColor: 0xd7ccc8 },
      { name: "主衛", x: 4.6, z: 4.6, w: 2.0, d: 2.2, floorColor: 0xb0bec5 },
      { name: "客衛", x: 4.6, z: 6.8, w: 2.0, d: 2.0, floorColor: 0xb0bec5 },
      { name: "次臥", x: 6.6, z: 4.6, w: 2.6, d: 4.2, floorColor: 0xd7ccc8 },
      { name: "書房", x: 9.2, z: 4.6, w: 2.2, d: 4.2, floorColor: 0xd7ccc8 }
    ];

    // ----------------------------------------------------
    // THREE.JS INITIALIZATION
    // ----------------------------------------------------
    const canvas3d = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c111d);
    scene.fog = new THREE.FogExp2(0x0c111d, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 14, 15);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
    controls.target.set(0, 0, 0);

    // ----------------------------------------------------
    // LIGHTING SETUP (Day / Night Support)
    // ----------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff8eb, 0.9);
    sunLight.position.set(10, 20, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 40;
    sunLight.shadow.camera.left = -12;
    sunLight.shadow.camera.right = 12;
    sunLight.shadow.camera.top = 12;
    sunLight.shadow.camera.bottom = -12;
    scene.add(sunLight);

    const warmPoints = [];
    function addWarmPoint(x, y, z) {
      const p = new THREE.PointLight(0xff9933, 0.8, 6);
      p.position.set(x, y, z);
      scene.add(p);
      warmPoints.push(p);
    }
    // Living, Dining, Master lights
    addWarmPoint(-2.5, 2.2, -2.0);
    addWarmPoint(1.0, 2.2, -2.0);
    addWarmPoint(-2.5, 2.2, 2.5);

    // ----------------------------------------------------
    // ARCHITECTURAL ELEMENTS & PROCEDURAL TEXTURING
    // ----------------------------------------------------
    const offsetOriginX = -PLAN_W / 2;
    const offsetOriginZ = -PLAN_D / 2;

    // Ground platform
    const slabGeo = new THREE.BoxGeometry(PLAN_W + 1.2, 0.3, PLAN_D + 1.2);
    const slabMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const slabMesh = new THREE.Mesh(slabGeo, slabMat);
    slabMesh.position.set(0, -0.15, 0);
    slabMesh.receiveShadow = true;
    scene.add(slabMesh);

    // Floors
    ROOMS.forEach(r => {
      const w = r.w, d = r.d;
      const geo = new THREE.BoxGeometry(w, 0.04, d);
      const mat = new THREE.MeshStandardMaterial({
        color: r.floorColor,
        roughness: 0.45,
        metalness: 0.1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(offsetOriginX + r.x + w/2, 0.02, offsetOriginZ + r.z + d/2);
      mesh.receiveShadow = true;
      scene.add(mesh);
    });

    // Walls
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0xf1f5f9,
      roughness: 0.7,
      transparent: true,
      opacity: 0.95
    });

    const WALL_SEGS = [
      // Outer border
      [0, 0, PLAN_W, 0], [PLAN_W, 0, PLAN_W, PLAN_D], [0, PLAN_D, PLAN_W, PLAN_D], [0, 0, 0, PLAN_D],
      // Inner partitions
      [0, 4.6, PLAN_W, 4.6],
      [4.8, 0, 4.8, 4.6],
      [8.0, 0, 8.0, 4.6],
      [4.6, 4.6, 4.6, 8.8],
      [6.6, 4.6, 6.6, 8.8],
      [9.2, 4.6, 9.2, 8.8],
      [4.6, 6.8, 6.6, 6.8]
    ];

    WALL_SEGS.forEach(([x1, z1, x2, z2]) => {
      const len = Math.hypot(x2 - x1, z2 - z1);
      const angle = Math.atan2(z2 - z1, x2 - x1);
      const geo = new THREE.BoxGeometry(len, WALL_H * 0.65, WALL_THICK);
      const mesh = new THREE.Mesh(geo, wallMat);
      const midX = (x1 + x2) / 2 + offsetOriginX;
      const midZ = (z1 + z2) / 2 + offsetOriginZ;
      mesh.position.set(midX, (WALL_H * 0.65) / 2, midZ);
      mesh.rotation.y = -angle;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    });

    // ----------------------------------------------------
    // DETAILED FURNITURE LAYER
    // ----------------------------------------------------
    const furnitureGroup = new THREE.Group();
    scene.add(furnitureGroup);

    function createDetailedBox(w, h, d, color, x, y, z, rotY = 0) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.05 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(offsetOriginX + x, y + h/2, offsetOriginZ + z);
      mesh.rotation.y = rotY;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      furnitureGroup.add(mesh);
      return mesh;
    }

    // Modern Sofa
    createDetailedBox(2.8, 0.45, 0.95, 0x475569, 1.8, 0, 1.0); // Cushion base
    createDetailedBox(2.8, 0.45, 0.25, 0x334155, 1.8, 0.45, 0.6); // Backrest
    createDetailedBox(0.3, 0.35, 0.95, 0x334155, 0.3, 0.3, 1.0); // Arm L
    createDetailedBox(0.3, 0.35, 0.95, 0x334155, 3.3, 0.3, 1.0); // Arm R

    // Coffee Table (Wood & Glass style)
    createDetailedBox(1.3, 0.35, 0.7, 0x854d0e, 1.8, 0, 2.3);

    // TV Unit & Big Flat TV
    createDetailedBox(2.6, 0.45, 0.4, 0x1e293b, 1.8, 0, 4.2);
    createDetailedBox(1.8, 1.0, 0.06, 0x0f172a, 1.8, 0.6, 4.3); // TV Screen

    // Dining Table & Chairs
    createDetailedBox(1.8, 0.75, 0.95, 0xa16207, 6.4, 0, 1.8);
    for (let dx = -0.5; dx <= 0.5; dx += 1.0) {
      createDetailedBox(0.45, 0.85, 0.45, 0x334155, 6.4 + dx, 0, 1.0);
      createDetailedBox(0.45, 0.85, 0.45, 0x334155, 6.4 + dx, 0, 2.6);
    }

    // Kitchen Counter & Island
    createDetailedBox(3.1, 0.88, 0.65, 0x475569, 9.6, 0, 0.6);
    createDetailedBox(0.75, 1.8, 0.75, 0x94a3b8, 11.0, 0, 2.0); // Fridge

    // Master Bedroom Suite (Bed, Pillows, Wardrobe)
    createDetailedBox(2.0, 0.5, 2.1, 0x3730a3, 1.6, 0, 6.8); // King bed
    createDetailedBox(2.2, 0.85, 0.2, 0x1e1b4b, 1.6, 0.4, 5.7); // Headboard
    createDetailedBox(0.65, 2.2, 3.2, 0x334155, 4.1, 0, 6.4); // Full-height closet

    // Secondary Bedroom & Study Desks
    createDetailedBox(1.3, 0.45, 2.0, 0x0284c7, 7.6, 0, 7.6); // Single bed
    createDetailedBox(1.6, 0.75, 0.7, 0x854d0e, 10.3, 0, 6.8); // Study desk

    // ----------------------------------------------------
    // ELECTRICAL & PLUMBING PIPELINE LAYERS
    // ----------------------------------------------------
    const electricalGroup = new THREE.Group();
    const plumbingGroup = new THREE.Group();
    scene.add(electricalGroup);
    scene.add(plumbingGroup);

    function createPipe(points, color, radius, group) {
      const curve = new THREE.CatmullRomCurve3(points.map(([x,y,z]) => new THREE.Vector3(offsetOriginX + x, y, offsetOriginZ + z)));
      const geo = new THREE.TubeGeometry(curve, 32, radius, 8, false);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive: color, emissiveIntensity: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);
    }

    // Electric circuits (Amber Glowing tubes)
    createPipe([[5.0, 0.15, 3.6], [5.0, 0.15, 1.8], [1.8, 0.15, 1.8], [1.8, 0.15, 4.2]], 0xf59e0b, 0.04, electricalGroup);
    createPipe([[5.0, 0.15, 3.6], [6.4, 0.15, 1.8], [9.6, 0.15, 0.8]], 0xf59e0b, 0.04, electricalGroup);
    createPipe([[5.0, 0.15, 3.6], [1.6, 0.15, 6.8]], 0xf59e0b, 0.04, electricalGroup);
    createPipe([[5.0, 0.15, 3.6], [10.3, 0.15, 6.8]], 0xf59e0b, 0.04, electricalGroup);

    // Plumbing conduits (Cyan & Blue tubes)
    createPipe([[9.6, 0.1, 3.6], [9.6, 0.1, 0.8], [8.2, 0.1, 0.8]], 0x0ea5e9, 0.05, plumbingGroup);
    createPipe([[9.6, 0.1, 3.6], [5.6, 0.1, 3.6], [5.6, 0.1, 5.5], [4.8, 0.1, 5.5]], 0x0284c7, 0.05, plumbingGroup);
    createPipe([[5.6, 0.1, 5.5], [5.6, 0.1, 7.8], [4.8, 0.1, 7.8]], 0x0284c7, 0.05, plumbingGroup);

    // ----------------------------------------------------
    // 2D CAD CANVAS RENDERING (Crisp Blueprint View)
    // ----------------------------------------------------
    const canvas2d = document.getElementById('cad2d-canvas');
    const ctx2d = canvas2d.getContext('2d');

    function render2DCAD() {
      const dpr = window.devicePixelRatio || 1;
      canvas2d.width = canvas2d.clientWidth * dpr;
      canvas2d.height = canvas2d.clientHeight * dpr;
      ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);

      const w = canvas2d.clientWidth, h = canvas2d.clientHeight;
      ctx2d.clearRect(0, 0, w, h);

      const scale = Math.min((w - 120) / PLAN_W, (h - 120) / PLAN_D);
      const ox = (w - PLAN_W * scale) / 2;
      const oy = (h - PLAN_D * scale) / 2;
      const sx = x => ox + x * scale;
      const sy = z => oy + z * scale;

      // Architectural Grid
      ctx2d.strokeStyle = "rgba(56, 189, 248, 0.08)";
      ctx2d.lineWidth = 1;
      for (let x = 0; x <= PLAN_W; x += 1) {
        ctx2d.beginPath(); ctx2d.moveTo(sx(x), sy(0)); ctx2d.lineTo(sx(x), sy(PLAN_D)); ctx2d.stroke();
      }
      for (let z = 0; z <= PLAN_D; z += 1) {
        ctx2d.beginPath(); ctx2d.moveTo(sx(0), sy(z)); ctx2d.lineTo(sx(PLAN_W), sy(z)); ctx2d.stroke();
      }

      // Rooms
      ROOMS.forEach(r => {
        ctx2d.fillStyle = "#131b2e";
        ctx2d.fillRect(sx(r.x), sy(r.z), r.w * scale, r.d * scale);
        ctx2d.strokeStyle = "#38bdf8";
        ctx2d.lineWidth = 2;
        ctx2d.strokeRect(sx(r.x), sy(r.z), r.w * scale, r.d * scale);

        // Labels
        ctx2d.fillStyle = "#f8fafc";
        ctx2d.font = "600 13px 'Noto Sans TC', sans-serif";
        ctx2d.textAlign = "center";
        ctx2d.fillText(r.name, sx(r.x + r.w/2), sy(r.z + r.d/2) - 4);
        ctx2d.fillStyle = "#94a3b8";
        ctx2d.font = "11px monospace";
        ctx2d.fillText(`${(r.w * 1000).toFixed(0)} × ${(r.d * 1000).toFixed(0)} mm`, sx(r.x + r.w/2), sy(r.z + r.d/2) + 14);
      });

      // Outer Structural Walls
      ctx2d.strokeStyle = "#ffffff";
      ctx2d.lineWidth = 4;
      ctx2d.strokeRect(sx(0), sy(0), PLAN_W * scale, PLAN_D * scale);

      // Total dimensions
      ctx2d.strokeStyle = "#38bdf8";
      ctx2d.fillStyle = "#38bdf8";
      ctx2d.lineWidth = 1.2;
      ctx2d.font = "bold 13px monospace";
      // Top
      ctx2d.beginPath(); ctx2d.moveTo(sx(0), sy(0) - 26); ctx2d.lineTo(sx(PLAN_W), sy(0) - 26); ctx2d.stroke();
      ctx2d.fillText("11,400 mm", sx(PLAN_W / 2), sy(0) - 34);
      // Left
      ctx2d.beginPath(); ctx2d.moveTo(sx(0) - 26, sy(0)); ctx2d.lineTo(sx(0) - 26, sy(PLAN_D)); ctx2d.stroke();
      ctx2d.save(); ctx2d.translate(sx(0) - 36, sy(PLAN_D / 2)); ctx2d.rotate(-Math.PI / 2);
      ctx2d.fillText("8,800 mm", 0, 0); ctx2d.restore();
    }

    // ----------------------------------------------------
    // INTERACTION & CAMERA ANIMATION
    // ----------------------------------------------------
    let autoRotate = false;
    let targetCamPos = null, targetLookAt = null;

    function moveCameraTo(x, y, z, tx, ty, tz) {
      targetCamPos = new THREE.Vector3(x, y, z);
      targetLookAt = new THREE.Vector3(tx, ty, tz);
    }

    document.getElementById('btnResetCam').onclick = () => {
      moveCameraTo(0, 14, 15, 0, 0, 0);
      autoRotate = false;
    };
    document.getElementById('btnAutoSpin').onclick = () => {
      autoRotate = !autoRotate;
      document.getElementById('btnAutoSpin').classList.toggle('active', autoRotate);
    };

    // Quick Room Focus
    document.getElementById('btnRoomLiving').onclick = () => moveCameraTo(-3.5, 3.2, 2.5, -2.5, 0.8, -1.5);
    document.getElementById('btnRoomMaster').onclick = () => moveCameraTo(-2.8, 3.0, 7.5, -2.5, 0.6, 4.0);
    document.getElementById('btnRoomDining').onclick = () => moveCameraTo(2.5, 3.5, 2.5, 1.2, 0.8, -1.8);

    // Mode Switch
    const modeOrbit = document.getElementById('modeOrbit');
    const modeFPS = document.getElementById('modeFPS');
    const modeCAD = document.getElementById('modeCAD');

    modeOrbit.onclick = () => {
      modeOrbit.classList.add('active'); modeFPS.classList.remove('active'); modeCAD.classList.remove('active');
      canvas3d.style.display = 'block'; canvas2d.style.display = 'none';
      moveCameraTo(0, 14, 15, 0, 0, 0);
    };
    modeFPS.onclick = () => {
      modeFPS.classList.add('active'); modeOrbit.classList.remove('active'); modeCAD.classList.remove('active');
      canvas3d.style.display = 'block'; canvas2d.style.display = 'none';
      // Walk into Entrance looking toward Living Room
      moveCameraTo(0.2, 1.6, 0.5, -3.5, 1.2, -1.5);
    };
    modeCAD.onclick = () => {
      modeCAD.classList.add('active'); modeOrbit.classList.remove('active'); modeFPS.classList.remove('active');
      canvas3d.style.display = 'none'; canvas2d.style.display = 'block';
      render2DCAD();
    };

    // Layer Controls
    document.getElementById('chkFurniture').onchange = e => furnitureGroup.visible = e.target.checked;
    document.getElementById('chkElectrical').onchange = e => electricalGroup.visible = e.target.checked;
    document.getElementById('chkPlumbing').onchange = e => plumbingGroup.visible = e.target.checked;

    // Day/Night switch
    const btnDay = document.getElementById('btnDay');
    const btnNight = document.getElementById('btnNight');
    btnDay.onclick = () => {
      btnDay.classList.add('active'); btnNight.classList.remove('active');
      scene.background.set(0x0c111d);
      sunLight.intensity = 0.9;
      ambientLight.intensity = 0.65;
      warmPoints.forEach(p => p.intensity = 0.4);
    };
    btnNight.onclick = () => {
      btnNight.classList.add('active'); btnDay.classList.remove('active');
      scene.background.set(0x04060a);
      sunLight.intensity = 0.08;
      ambientLight.intensity = 0.2;
      warmPoints.forEach(p => p.intensity = 1.4);
    };

    // ----------------------------------------------------
    // RESIZE & RENDER LOOP
    // ----------------------------------------------------
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight - 60;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (canvas2d.style.display === 'block') render2DCAD();
    }
    window.addEventListener('resize', onResize);
    onResize();

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate && modeOrbit.classList.contains('active')) {
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.2;
      } else {
        controls.autoRotate = false;
      }

      // Smooth camera lerp
      if (targetCamPos && targetLookAt) {
        camera.position.lerp(targetCamPos, 0.06);
        controls.target.lerp(targetLookAt, 0.06);
        if (camera.position.distanceTo(targetCamPos) < 0.05) {
          targetCamPos = null; targetLookAt = null;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
